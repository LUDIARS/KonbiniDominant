<main id="game" aria-label="Konbini Dominant">

  <section id="portrait" class="message" hidden><strong>横向きでプレイ</strong><p>端末を横向きにしてください。</p></section>
  <section id="failure" class="message" role="alert" hidden><strong>ゲームを開始できませんでした</strong><p id="failure-text"></p><button id="reload" type="button">再読み込み</button></section>
</main>
<footer><span>KONBINI DOMINANT</span><span>タップで選択・出店 / ドラッグで移動 / ピンチでズーム</span><button id="fullscreen" type="button">全画面</button></footer>
