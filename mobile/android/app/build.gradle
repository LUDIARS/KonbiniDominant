plugins { id 'com.android.application' }
android {
    namespace 'com.ludiars.konbinidominant'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.ludiars.konbinidominant'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DKONBINI_BUILD_TESTS=OFF'
                targets 'konbini_mobile'
            }
        }
    }
    externalNativeBuild { cmake { path '../../../CMakeLists.txt'; version '3.31.1' } }
    sourceSets {
        debug { assets.srcDirs = ['../../../build-mobile-assets/debug'] }
        release { assets.srcDirs = ['../../../build-mobile-assets/release'] }
    }
}
tasks.configureEach {
    if (name == 'mergeDebugAssets') dependsOn 'externalNativeBuildDebug'
    if (name == 'mergeReleaseAssets') dependsOn 'externalNativeBuildRelease'
}
